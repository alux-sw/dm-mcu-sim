<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SM ↔ MCU 디버그</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; margin: 0; background: #1e1f22; color: #ddd; }
  header { display: flex; gap: 24px; align-items: center; padding: 8px 14px; background: #2b2d31; border-bottom: 1px solid #444; position: sticky; top: 0; z-index: 1; }
  header b { font-size: 15px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 10px; padding: 10px; }
  section { background: #2b2d31; border: 1px solid #444; border-radius: 6px; padding: 8px 10px; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #9cf; }
  h2 button { float: right; font-size: 11px; padding: 1px 6px; margin: 0; }
  body.rx-only main > section:not(#rx_section) { display: none; }
  body.rx-only main { grid-template-columns: 1fr; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 6px; border-bottom: 1px solid #3a3c40; vertical-align: top; }
  td:first-child { color: #aaa; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 3px; background: #444; color: #888; }
  .chip.on { background: #2e7d32; color: #fff; }
  .chip.bad { background: #c62828; color: #fff; }
  button { margin: 2px; padding: 3px 8px; background: #3b3f46; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
  button:hover { background: #50555e; }
  input, select { background: #1e1f22; color: #eee; border: 1px solid #666; border-radius: 3px; padding: 2px 4px; width: 80px; }
  input[type=checkbox] { width: auto; }
  label { white-space: nowrap; }
  pre { margin: 0; font-size: 11px; max-height: 220px; overflow: auto; background: #1a1b1e; padding: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .err { color: #f66; }
  .rx-head { color: #aaa; margin: 6px 0 2px; }
  .rx-bytes { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; }
  .rx-sec { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px 4px 3px 6px; border-left: 3px solid var(--sec, #666); background: #202124; border-radius: 3px; }
  #rx_section { --rxf: 15px; }                 /* RX 바이트 글자 크기. 이 값만 바꾸면 패널 전체 크기가 따라갑니다 */
  body.rx-only #rx_section { --rxf: 20px; }    /* 새 창은 더 크게 */
  body.hide-rsv .rx-grp.rsv { display: none; }  /* 예약(미할당) 주소 숨기기 */
  .rx-sec > b { width: 100%; font-size: calc(var(--rxf) * 0.7); font-weight: normal; color: var(--sec, #888); }
  .rx-grp { display: inline-flex; flex-direction: column; align-items: center; }
  .rx-grp > b { font-size: calc(var(--rxf) * 0.62); font-weight: normal; color: #9ab; white-space: nowrap; }
  .rx-grp > b.dim { color: #555; }
  .rx-grp > div { display: flex; gap: 1px; }
  .rxb { font-family: ui-monospace, monospace; font-size: var(--rxf); width: calc(var(--rxf) * 2.1); text-align: center; background: #26272b; border-radius: 3px; padding: 1px 0; }
  .rxb i { display: block; font-style: normal; font-size: calc(var(--rxf) * 0.62); color: #666; }
  .rxb.hdr { color: #8ab; }
  .rxb.chg { animation: rxflash 1.5s ease-out; }
  @keyframes rxflash { 0% { background: #f9d71c; color: #000; } 100% { background: #26272b; color: #ddd; } }
  .dim { opacity: .2; }
</style>
</head>
<body>
<header>
  <b>SM ↔ MCU 디버그</b>
  <span id="link"></span>
  <span id="linkerr" class="err"></span>
</header>
<main>
  <section>
    <h2>MCU 상태</h2>
    <div id="mcu_status"></div>
    <div>HARD_BLOCK: <span id="hard_block"></span></div>
    <table id="mcu_tbl"></table>
  </section>
  <section>
    <h2>명령 피드백</h2>
    <table id="fb_tbl"></table>
  </section>
  <section>
    <h2>커버 / 슬라이드</h2>
    <table id="motion_tbl"></table>
  </section>
  <section>
    <h2>충전기</h2>
    <table id="chg_tbl"></table>
  </section>
  <section>
    <h2>환경 / 전원</h2>
    <table id="env_tbl"></table>
  </section>
  <section>
    <h2>설정 (보유 레지스터 쓰기) / 되읽기</h2>
    <table id="set_tbl">
      <tr data-reg="SET_CLIMATE_MODE"><td>공조 모드</td><td><select data-addr="32"><option value="0">off</option><option value="1">auto</option></select></td><td id="rb_climate" data-reg="CLIMATE_MODE"></td></tr>
      <tr data-reg="SET_LIGHT"><td>조명</td><td><label><input type="checkbox" class="bit" data-addr="33" data-bit="0"> 내부</label> <label><input type="checkbox" class="bit" data-addr="33" data-bit="1"> 외부</label></td><td id="rb_light" data-reg="LIGHT_STATE"></td></tr>
      <tr data-reg="SET_ALARM_OUT"><td>알람 출력</td><td><label><input type="checkbox" class="bit" data-addr="34" data-bit="0"> 부저</label> <label><input type="checkbox" class="bit" data-addr="34" data-bit="1"> LED</label></td><td id="rb_alarm" data-reg="ALARM_OUT_STATE"></td></tr>
      <tr data-reg="SET_LED_PATTERN"><td>LED 패턴</td><td><select data-addr="35" id="led_sel"></select></td><td id="rb_led" data-reg="LED_PATTERN"></td></tr>
      <tr data-reg="SET_CHG_CURRENT_LIMIT_10mA"><td>충전 전류 상한 (10mA)</td><td><input type="number" data-addr="36" value="0"></td><td id="rb_chglim" data-reg="CHG_CURRENT_LIMIT_10mA"></td></tr>
      <tr data-reg="SET_MAINT_MODE"><td>정비 모드</td><td><select data-addr="37"><option value="0">off</option><option value="1">on</option></select></td><td id="rb_maint" data-reg="MAINT_ACTIVE"></td></tr>
    </table>
  </section>
  <section>
    <h2>BMS 미러</h2>
    <div id="bms_tbl" class="grid2"></div>
  </section>
  <section>
    <h2>명령 (SM → MCU)</h2>
    <div>
      <button data-code="1">COVER_OPEN</button><button data-code="2">COVER_CLOSE</button>
      <button data-code="3">SLIDE_EXTEND</button><button data-code="4">SLIDE_RETRACT</button>
    </div>
    <div>
      충전 상한(10mA, 0=설정값) <input type="number" id="chg_arg" value="0">
      <button data-code="5">CHARGE_ON</button><button data-code="6">CHARGE_OFF</button>
    </div>
    <div>
      <button data-code="7">BMS_POWER_ON</button><button data-code="8">BMS_POWER_OFF</button>
      <button data-code="9">MOTION_STOP</button><button data-code="11">CLEAR_FAULT</button>
    </div>
    <div>
      전원 재투입 지연(초) <input type="number" id="pc_delay" value="3">
      <button data-code="15">STATION_POWER_CYCLE</button>
      임의 코드 <input type="number" id="raw_code" value="255"><button data-code="raw">전송</button>
    </div>
  </section>
  <section>
    <h2>명령 로그 (SM 시점)</h2>
    <pre id="cmd_log"></pre>
  </section>
  <section class="wide" id="rx_section">
    <h2>마지막 RX (요청별 고정, 노란색 = 직전 표시 대비 바뀐 바이트) <button id="rx_rsv">예약 숨기기</button> <button id="rx_popout">새 창</button></h2>
    <div id="rx_panel"></div>
  </section>
  <section class="wide">
    <h2>프레임 (최근 40)</h2>
    <pre id="frames"></pre>
  </section>
</main>
<script>
const LED_NAMES = ["OFF", "대기", "모션 중", "개방 대기", "드론 비행 중", "SAFE-HOLD", "FAULT", "정비 모드", "충전 중", "업데이트 중"];
const MCU_STATUS_BITS = ["estop", "safe_hold", "fault", "hb_timeout", "sd_ok", "bms_link", "drone_detected", "motion_active"];
const MCU_STATUS_BAD = ["estop", "safe_hold", "fault", "hb_timeout"];
const HI_BITS = ["HI-1", "HI-2", "HI-3", "HI-4", "HI-5", "HI-6"];
const CMD_CHARGE_ON = 5;
const CMD_POWER_CYCLE = 15;
const POWER_CYCLE_MAGIC = 0xA5A5;
const DERIVED_REGS = {
  BMS_CURRENT_mA: ["BMS_CURRENT_mA_HI", "BMS_CURRENT_mA_LO"],
  BMS_FAULT_FLAGS: ["BMS_FAULT_FLAGS_HI", "BMS_FAULT_FLAGS_LO"],
  BMS_PF_STATUS: ["BMS_PF_STATUS_HI", "BMS_PF_STATUS_LO"],
  BMS_SAFETY_STATUS: ["BMS_SAFETY_STATUS_HI", "BMS_SAFETY_STATUS_LO"],
};
let ICD = null;
let HOLDING_BY_ADDR = {};

async function getJson(url) {
  const r = await fetch(url);
  return r.json();
}

async function postJson(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function byId(id) {
  return document.getElementById(id);
}

function setText(id, text) {
  byId(id).textContent = text;
}

function setHtml(id, html) {
  byId(id).innerHTML = html;
}

function setClass(id, cls, on) {
  byId(id).classList.toggle(cls, on);
}

function escapeAttr(text) {
  return text.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function regLine(name) {
  let entry = ICD.inputs[name];
  if (entry === undefined) {
    entry = ICD.holding[name];
  }
  if (entry === undefined) {
    return name;
  }
  return `${name} (0x${entry[0].toString(16).toUpperCase().padStart(4, "0")}): ${entry[1]}`;
}

function tip(regs, extra) {
  if (ICD === null || regs === undefined) {
    return "";
  }
  let names = regs;
  const is_single = typeof regs === "string";
  if (is_single) {
    names = DERIVED_REGS[regs] || [regs];
  }
  let text = names.map(regLine).join("\n");
  if (extra) {
    text += "\n" + extra;
  }
  return text;
}

function reasonTip(name) {
  if (ICD === null || ICD.reasons[name] === undefined) {
    return "";
  }
  return `${name}: ${ICD.reasons[name]}`;
}

function rows(id, pairs) {
  setHtml(id, pairs.map(p => `<tr title="${escapeAttr(tip(p[2], p[3]))}"><td>${p[0]}</td><td>${p[1]}</td></tr>`).join(""));
}

function chips(list, all, badSet) {
  return all.map(name => {
    let cls = "chip";
    const is_set = list.includes(name);
    const is_bad = badSet !== undefined && badSet.includes(name);
    if (is_set && is_bad) {
      cls += " bad";
    } else if (is_set) {
      cls += " on";
    }
    return `<span class="${cls}">${name}</span>`;
  }).join("");
}

function fmtTime(t) {
  return new Date(t * 1000).toLocaleTimeString("ko-KR", { hour12: false }) + "." + String(Math.floor((t % 1) * 10));
}

function fmtCmd(c) {
  let line = `${fmtTime(c.t)} #${c.seq} ${c.name}(${c.arg0},${c.arg1})`;
  if (c.sent === false) {
    line += " SEND-FAIL";
  }
  if (c.ack) {
    let ack = "접수";
    if (c.ack.result !== 0) {
      ack = "거부:" + c.ack.reason;
    }
    line += ` | ACK ${ack} +${((c.ack.t - c.t) * 1000).toFixed(0)}ms`;
  }
  if (c.done) {
    line += ` | DONE ${c.done.result} data=${c.done.data} +${((c.done.t - c.t) * 1000).toFixed(0)}ms`;
  }
  return line;
}

const FC_NAMES = { 3: "READ_HOLDING", 4: "READ_INPUT", 6: "WRITE_SINGLE", 16: "WRITE_MULTI" };
let INPUT_BY_ADDR = {};
const rxShown = {};  // key → 마지막으로 그린 hex

function rxRegName(fc, addr) {
  let names = HOLDING_BY_ADDR;  // 0x03 읽기·0x06/0x10 쓰기는 보유 레지스터
  if (fc === 4) {
    names = INPUT_BY_ADDR;
  }
  const name = names[addr];
  if (name === undefined) {
    return "0x" + addr.toString(16).toUpperCase().padStart(4, "0");
  }
  return name;
}

function rxByteTip(fc, addr, i, len) {
  const is_read = fc === 3 || fc === 4;
  if (i === 0) {
    return "슬레이브 주소";
  }
  if (i === 1) {
    return "FC";
  }
  if (i >= len - 2) {
    return "CRC";
  }
  if (is_read) {
    if (i === 2) {
      return "바이트 수";
    }
    const reg = addr + ((i - 3) >> 1);
    let half = "HI";
    if ((i - 3) % 2 === 1) {
      half = "LO";
    }
    return `${rxRegName(fc, reg)} ${half}`;
  }
  if (i <= 3) {
    return "시작 주소";
  }
  if (fc === 6) {
    return rxRegName(fc, addr) + " 값";
  }
  return "레지스터 수";
}

const INPUT_SECTIONS = [[0x00, "명령 피드백"], [0x10, "MCU 상태"], [0x20, "커버/슬라이드"], [0x30, "충전기"], [0x40, "환경"], [0x50, "전원"], [0x60, "출력 되읽기"], [0x80, "BMS"], [0xB0, "BMS 식별"]];
const HOLDING_SECTIONS = [[0x00, "하트비트"], [0x10, "명령"], [0x20, "설정"]];
const SEC_COLORS = ["#8ab", "#a8b", "#ab8", "#ba8", "#b8a", "#8ba", "#aa9", "#99a", "#9a9"];

function rxSection(fc, addr) {
  let sections = INPUT_SECTIONS;
  if (fc === 3) {
    sections = HOLDING_SECTIONS;
  }
  let found = 0;
  sections.forEach((sec, i) => {
    if (addr >= sec[0]) {
      found = i;
    }
  });
  return [sections[found][1] + " 0x" + sections[found][0].toString(16).toUpperCase().padStart(2, "0"), SEC_COLORS[found % SEC_COLORS.length]];
}

function rxCell(i, hex, cls) {
  return `<span class="rxb ${cls}" data-i="${i}"><i>${i}</i>${hex}</span>`;
}

function rxGroup(label, cellsHtml, isDim) {
  let cls = "";
  if (isDim) {
    cls = "dim";
  }
  return `<div class="rx-grp ${isDim ? "rsv" : ""}"><b class="${cls}">${label}</b><div>${cellsHtml}</div></div>`;
}

function rxSectionHtml(label, color, groupsHtml) {
  return `<div class="rx-sec" style="--sec:${color}"><b>${label}</b>${groupsHtml}</div>`;
}

function rxLayoutHtml(fc, addr, bytes) {
  const n = bytes.length;
  const is_read = fc === 3 || fc === 4;
  const crc = rxSectionHtml("CRC", "#777", rxGroup("CRC16", rxCell(n - 2, bytes[n - 2], "hdr") + rxCell(n - 1, bytes[n - 1], "hdr")));
  if (!is_read) {
    let valueLabel = "레지스터 수";
    if (fc === 6) {
      valueLabel = rxRegName(fc, addr) + " 값";
    }
    const head = rxSectionHtml("헤더", "#777", rxGroup("주소", rxCell(0, bytes[0], "hdr")) + rxGroup("FC", rxCell(1, bytes[1], "hdr")));
    const body = rxSectionHtml("쓰기 반향", "#8ab", rxGroup("시작 주소", rxCell(2, bytes[2], "") + rxCell(3, bytes[3], "")) + rxGroup(valueLabel, rxCell(4, bytes[4], "") + rxCell(5, bytes[5], "")));
    return head + body + crc;
  }
  const head = rxSectionHtml("헤더", "#777", rxGroup("주소", rxCell(0, bytes[0], "hdr")) + rxGroup("FC", rxCell(1, bytes[1], "hdr")) + rxGroup("바이트 수", rxCell(2, bytes[2], "hdr")));
  const regCount = (n - 5) >> 1;
  let html = head;
  let secLabel = null;
  let secColor = "";
  let groups = "";
  let reserved = null;  // 연속된 예약 주소 묶음 {from, to, cells}
  const flushReserved = () => {
    if (reserved === null) {
      return;
    }
    const hex = a => "0x" + a.toString(16).toUpperCase().padStart(2, "0");
    let label = "예약 " + hex(reserved.from);
    if (reserved.to !== reserved.from) {
      label += "~" + hex(reserved.to);
    }
    groups += rxGroup(label, reserved.cells, true);
    reserved = null;
  };
  for (let r = 0; r < regCount; r++) {
    const reg = addr + r;
    const [label, color] = rxSection(fc, reg);
    if (label !== secLabel) {
      flushReserved();
      if (secLabel !== null) {
        html += rxSectionHtml(secLabel, secColor, groups);
      }
      secLabel = label;
      secColor = color;
      groups = "";
    }
    const i = 3 + r * 2;
    const cells = rxCell(i, bytes[i], "") + rxCell(i + 1, bytes[i + 1], "");
    let name = rxRegName(fc, reg);
    const is_reserved = name.startsWith("0x");
    if (is_reserved) {
      if (reserved === null) {
        reserved = { from: reg, to: reg, cells: "" };
      }
      reserved.to = reg;
      reserved.cells += cells;
      continue;
    }
    flushReserved();
    if (label.startsWith("BMS") && name.startsWith("BMS_")) {
      name = name.slice(4);
    }
    groups += rxGroup(name, cells, false);
  }
  flushReserved();
  if (secLabel !== null) {
    html += rxSectionHtml(secLabel, secColor, groups);
  }
  return html + crc;
}

function renderRx(rx) {
  if (ICD === null) {
    return;
  }
  const panel = byId("rx_panel");
  Object.keys(rx).sort().forEach(key => {
    const [t, txHex, rxHex] = rx[key];
    const fc = parseInt(key.slice(0, 2), 16);
    const addr = parseInt(key.slice(3), 16);
    const bytes = rxHex.match(/../g) || [];
    let block = panel.querySelector(`[data-key="${key}"]`);
    const is_new_layout = block === null || rxShown[key] === undefined || rxShown[key].length !== rxHex.length;
    if (is_new_layout) {
      if (block === null) {
        block = document.createElement("div");
        block.dataset.key = key;
        panel.appendChild(block);
      }
      block.innerHTML = `<div class="rx-head"></div><div class="rx-bytes">${rxLayoutHtml(fc, addr, bytes)}</div>`;
      block.querySelectorAll(".rxb").forEach(el => {
        el.title = `[${el.dataset.i}] ` + rxByteTip(fc, addr, parseInt(el.dataset.i), bytes.length);
      });
    } else {
      const old = rxShown[key].match(/../g);
      const cells = block.querySelectorAll(".rxb");
      bytes.forEach((b, i) => {
        if (b === old[i]) {
          return;
        }
        const el = cells[i];
        el.lastChild.textContent = b;
        el.classList.remove("chg");
        void el.offsetWidth;
        el.classList.add("chg");
      });
    }
    rxShown[key] = rxHex;
    const fcName = FC_NAMES[fc] || "?";
    block.firstChild.textContent = `0x${fc.toString(16).toUpperCase().padStart(2, "0")} ${fcName} @0x${addr.toString(16).toUpperCase().padStart(4, "0")} (${rxRegName(fc, addr)})  →  ${bytes.length} bytes  |  ${fmtTime(t)}  |  TX ${txHex}`;
  });
}

function refreshSettings(holding) {
  document.querySelectorAll("#set_tbl [data-addr]").forEach(el => {
    const is_editing = el === document.activeElement;
    if (is_editing) {
      return;
    }
    const name = HOLDING_BY_ADDR[el.dataset.addr];
    if (name === undefined) {
      return;
    }
    const value = holding[name];
    const is_bit = el.classList.contains("bit");
    if (is_bit) {
      el.checked = ((value >> parseInt(el.dataset.bit)) & 1) === 1;
    } else {
      el.value = value;
    }
  });
}

function applyStaticTitles() {
  byId("mcu_status").title = tip("MCU_STATUS");
  byId("hard_block").title = tip("HARD_BLOCK");
  document.querySelectorAll("[data-reg]").forEach(el => {
    el.title = tip(el.dataset.reg);
  });
  document.querySelectorAll("button[data-code]").forEach(b => {
    const entry = ICD.cmds[b.dataset.code];
    if (entry !== undefined) {
      b.title = `0x${parseInt(b.dataset.code).toString(16).toUpperCase().padStart(4, "0")} ${entry[0]}: ${entry[1]}`;
    }
  });
}

function renderMaster(s) {
  const r = s.regs;
  const d = s.decoded;
  const st = s.link.stats;
  setText("link", `${s.link.port}  ok ${st.ok} / timeout ${st.timeout} / exception ${st.exception}  |  상태 age ${s.link.status_age}s  |  HB_SEQ ${s.link.hb_seq}`);
  let linkErr = "";
  if (s.link.status_age > 1) {
    linkErr = "MCU 응답 없음: " + s.link.last_error;
  }
  setText("linkerr", linkErr);
  setHtml("mcu_status", chips(d.mcu_status, MCU_STATUS_BITS, MCU_STATUS_BAD));
  setHtml("hard_block", chips(d.hard_block, HI_BITS, HI_BITS));
  rows("mcu_tbl", [
    ["FAULT_CODE", d.fault, "FAULT_CODE", reasonTip(d.fault)],
    ["FW", d.fw, ["FW_VER_MAJ_MIN", "FW_VER_PATCH"]],
    ["LOCAL_BTN", chips(d.local_btn, ["BTN-DOOR", "BTN-SLIDE"]), "LOCAL_BTN"],
    ["정비 모드", `${r.MAINT_ACTIVE} / ${d.maint_source}`, ["MAINT_ACTIVE", "MAINT_SOURCE"]],
  ]);
  let ackText = "접수";
  if (r.ACK_RESULT !== 0) {
    ackText = "거부";
  }
  rows("fb_tbl", [
    ["ACK", `seq ${r.ACK_SEQ} / ${ackText} / ${d.ack_reason}`, ["ACK_SEQ", "ACK_RESULT", "ACK_REASON"], reasonTip(d.ack_reason)],
    ["DONE", `seq ${r.DONE_SEQ} / ${d.done_result} / data ${r.DONE_DATA}`, ["DONE_SEQ", "DONE_RESULT", "DONE_DATA"]],
    ["ACTIVE", `seq ${r.ACTIVE_SEQ} / ${r.PROGRESS_PCT}%`, ["ACTIVE_SEQ", "PROGRESS_PCT"]],
  ]);
  rows("motion_tbl", [
    ["COVER_STATE", d.cover_state, "COVER_STATE"],
    ["COVER_LIMITS", chips(d.cover_limits, ["closed", "open"]), "COVER_LIMITS"],
    ["COVER_CURRENT", r.COVER_CURRENT_mA + " mA", "COVER_CURRENT_mA"],
    ["SLIDE_STATE", d.slide_state, "SLIDE_STATE"],
    ["SLIDE_LIMITS", chips(d.slide_limits, ["home", "extended", "load_sensor"]), "SLIDE_LIMITS"],
    ["SLIDE_CURRENT", r.SLIDE_CURRENT_mA + " mA", "SLIDE_CURRENT_mA"],
    ["SLIDE_ENCODER", r.SLIDE_ENCODER, "SLIDE_ENCODER"],
  ]);
  rows("chg_tbl", [
    ["CHG_STATE", d.chg_state, "CHG_STATE"],
    ["OUTPUT_ON", r.CHG_OUTPUT_ON, "CHG_OUTPUT_ON"],
    ["전압 / 전류", `${(r.CHG_VOLTAGE_10mV / 100).toFixed(2)} V / ${(r.CHG_CURRENT_10mA / 100).toFixed(2)} A`, ["CHG_VOLTAGE_10mV", "CHG_CURRENT_10mA"]],
    ["전류 상한", `${(r.CHG_CURRENT_LIMIT_10mA / 100).toFixed(2)} A`, "CHG_CURRENT_LIMIT_10mA"],
    ["접점 온도", `${(r.CONTACT_TEMP_x10 / 10).toFixed(1)} ℃`, "CONTACT_TEMP_x10"],
    ["CHG_FAULT", d.chg_fault, "CHG_FAULT_CODE"],
  ]);
  rows("env_tbl", [
    ["내부 온습도", `${(r.TEMP_IN_x10 / 10).toFixed(1)} ℃ / ${(r.HUM_IN_x10 / 10).toFixed(1)} %`, ["TEMP_IN_x10", "HUM_IN_x10"]],
    ["FLOOD", r.FLOOD, "FLOOD"],
    ["ENV_STALE", chips(d.env_stale, ["temp_hum", "flood"]), "ENV_STALE"],
    ["PWR_FLAGS", chips(d.pwr_flags, ["ac_ok", "ups_on_battery", "ups_charging"]), "PWR_FLAGS"],
    ["UPS", `${(r.UPS_VOLTAGE_10mV / 100).toFixed(2)} V / ${r.UPS_SOC_PCT} %`, ["UPS_VOLTAGE_10mV", "UPS_SOC_PCT"]],
    ["24V 버스", `${(r.BUS24_10mV / 100).toFixed(2)} V / ${(r.BUS24_10mA / 100).toFixed(2)} A`, ["BUS24_10mV", "BUS24_10mA"]],
    ["48V 버스", `${(r.BUS48_10mV / 100).toFixed(2)} V / ${(r.BUS48_10mA / 100).toFixed(2)} A`, ["BUS48_10mV", "BUS48_10mA"]],
    ["공조 출력", chips(d.climate_out, ["heater", "cooler", "fan"]), "CLIMATE_OUT"],
  ]);
  setText("rb_climate", "되읽기 " + r.CLIMATE_MODE);
  setHtml("rb_light", chips(d.light, ["inner", "outer"]));
  setHtml("rb_alarm", chips(d.alarm, ["buzzer", "indicator"]));
  setText("rb_led", "되읽기 " + d.led_pattern);
  setText("rb_chglim", "적용 " + r.CHG_CURRENT_LIMIT_10mA);
  setText("rb_maint", `되읽기 ${r.MAINT_ACTIVE} (${d.maint_source})`);
  const bmsKeys = Object.keys(r).filter(k => k.startsWith("BMS_") && !/_(HI|LO)$/.test(k));
  setHtml("bms_tbl", bmsKeys.map(k => `<div title="${escapeAttr(tip(k))}"><span style="color:#aaa">${k.slice(4)}</span> ${r[k]}</div>`).join(""));
  setText("cmd_log", s.cmds.map(fmtCmd).join("\n"));
  renderRx(s.rx);
  setText("frames", s.frames.slice().reverse().map(f => `${fmtTime(f[0])} ${f[1]} ${f[2].replace(/(..)/g, "$1 ")}`).join("\n"));
  refreshSettings(s.holding);
}

function numberOf(id) {
  return parseInt(byId(id).value);
}

function sendCommand(button) {
  let code = parseInt(button.dataset.code);
  const is_raw = button.dataset.code === "raw";
  if (is_raw) {
    code = numberOf("raw_code");
  }
  let arg0 = 0;
  let arg1 = 0;
  if (code === CMD_CHARGE_ON) {
    arg0 = numberOf("chg_arg");
  }
  if (code === CMD_POWER_CYCLE) {
    arg0 = POWER_CYCLE_MAGIC;
    arg1 = numberOf("pc_delay");
  }
  postJson("/api/cmd", { code, arg0, arg1 });
}

function writeBits(addr) {
  let value = 0;
  document.querySelectorAll(`#set_tbl input.bit[data-addr="${addr}"]`).forEach(b => {
    if (b.checked) {
      value |= 1 << parseInt(b.dataset.bit);
    }
  });
  postJson("/api/write", { addr: parseInt(addr), value });
}

document.querySelectorAll("button[data-code]").forEach(b => b.addEventListener("click", () => sendCommand(b)));
byId("led_sel").innerHTML = LED_NAMES.map((name, i) => `<option value="${i}">${i} ${name}</option>`).join("");
document.querySelectorAll("#set_tbl select, #set_tbl input[type=number]").forEach(el => el.addEventListener("change", () => {
  postJson("/api/write", { addr: parseInt(el.dataset.addr), value: parseInt(el.value) });
}));
document.querySelectorAll("#set_tbl input.bit").forEach(el => el.addEventListener("change", () => writeBits(el.dataset.addr)));
getJson("/api/icd").then(info => {
  ICD = info;
  Object.keys(info.holding).forEach(name => {
    HOLDING_BY_ADDR[info.holding[name][0]] = name;
  });
  Object.keys(info.inputs).forEach(name => {
    INPUT_BY_ADDR[info.inputs[name][0]] = name;
  });
  applyStaticTitles();
});

// #rx 로 열면 RX 패널만 보이는 창이 됩니다 (해시라서 서버는 같은 '/' 를 내보냅니다)
const rsvBtn = byId("rx_rsv");
const setRsv = hide => {
  document.body.classList.toggle("hide-rsv", hide);
  rsvBtn.textContent = hide ? "예약 보기" : "예약 숨기기";
  localStorage.setItem("hideRsv", hide ? "1" : "");
};
rsvBtn.addEventListener("click", () => setRsv(!document.body.classList.contains("hide-rsv")));
setRsv(localStorage.getItem("hideRsv") === "1");

const isRxOnly = location.hash === "#rx";
document.body.classList.toggle("rx-only", isRxOnly);
byId("rx_popout").addEventListener("click", () => {
  window.open(location.pathname + "#rx", "rx_panel", "width=1500,height=900");
});
if (isRxOnly) {
  document.title = "RX 바이트";
  byId("rx_popout").style.display = "none";
}

// 드래그 중에 DOM 을 다시 그리면 텍스트 선택이 풀려서, 그동안은 갱신을 멈춥니다
let mouseDown = false;
document.addEventListener("mousedown", () => { mouseDown = true; });
window.addEventListener("mouseup", () => { mouseDown = false; });
window.addEventListener("blur", () => { mouseDown = false; });

function isSelectingText() {
  if (mouseDown) {
    return true;
  }
  const sel = window.getSelection();
  return sel !== null && sel.rangeCount > 0 && !sel.isCollapsed;
}

setInterval(() => {
  if (isSelectingText()) {
    return;
  }
  getJson("/api/state").then(renderMaster).catch(() => setText("linkerr", "sm_master 연결 실패"));
}, 200);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MCU 시뮬레이터</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; margin: 0; background: #1e1f22; color: #ddd; }
  header { display: flex; gap: 24px; align-items: center; padding: 8px 14px; background: #2b2d31; border-bottom: 1px solid #444; position: sticky; top: 0; z-index: 1; }
  header b { font-size: 15px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 10px; padding: 10px; }
  section { background: #2b2d31; border: 1px solid #444; border-radius: 6px; padding: 8px 10px; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #9cf; }
  h2 button { float: right; font-size: 11px; padding: 1px 6px; margin: 0; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 6px; border-bottom: 1px solid #3a3c40; vertical-align: top; }
  td:first-child { color: #aaa; white-space: nowrap; }
  button { margin: 2px; padding: 3px 8px; background: #3b3f46; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
  button:hover { background: #50555e; }
  input, select { background: #1e1f22; color: #eee; border: 1px solid #666; border-radius: 3px; padding: 2px 4px; width: 80px; }
  input[type=checkbox] { width: auto; }
  label { white-space: nowrap; }
  pre { margin: 0; font-size: 11px; max-height: 220px; overflow: auto; background: #1a1b1e; padding: 4px; }
  .err { color: #f66; }
  #force_box { margin: 4px 0 6px; }
  #force_list { margin-top: 4px; }
  .force-chip { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 3px; background: #7a5d00; color: #ffe08a; cursor: pointer; }
  .force-chip:hover { background: #9a7400; }
  td.val { cursor: cell; }
  tr.forced td { background: #4a3a00; }
  .force-x { color: #ffe08a; cursor: pointer; margin-left: 4px; }
  .val-edit input { width: 72px; }
  .rx-head { color: #aaa; margin: 6px 0 2px; }
  .station-bar { display: flex; gap: 18px; align-items: center; margin-bottom: 4px; }
  .view-toggle button { margin: 0; }
  .view-toggle button.on { background: #1e88e5; border-color: #1e88e5; }
  #station3d { position: relative; width: 100%; max-width: 1100px; height: 440px; margin: 0 auto; border-radius: 6px; overflow: hidden; background: #17181b; }
  #station3d canvas { display: block; }
  #s3d_banner { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 26px; font-weight: bold; pointer-events: none; text-shadow: 0 0 10px #000; }
  #s3d_hint { position: absolute; bottom: 8px; left: 12px; color: #9aa; font-size: 11px; pointer-events: none; }
  svg { width: 100%; max-width: 1100px; display: block; margin: 0 auto; background: #17181b; border-radius: 6px; }
  svg text { font-family: system-ui, sans-serif; fill: #ccc; font-size: 12px; }
  .door { fill: #8a8f99; transition: transform .2s linear; }
  #door_front { transform-origin: 566px 290px; }
  #door_side { transform-origin: 210px 286px; }
  #platform { transition: transform .2s linear; }
  .moving { stroke: #ffb300; stroke-width: 2; }
  .hide { display: none; }
  .led.p0 { fill: #333; }
  .led.p1 { fill: #2e7d32; }
  .led.p2 { fill: #ffb300; animation: blink .6s infinite; }
  .led.p3 { fill: #1e88e5; }
  .led.p4 { fill: #00acc1; animation: blink 1s infinite; }
  .led.p5 { fill: #ef6c00; animation: blink .5s infinite; }
  .led.p6 { fill: #d32f2f; animation: blink .25s infinite; }
  .led.p7 { fill: #8e24aa; }
  .led.p8 { fill: #43a047; animation: breathe 2s infinite; }
  .led.p9 { fill: #eee; animation: blink .3s infinite; }
  .lamp { fill: #444; }
  .lamp.on { fill: #fff59d; filter: drop-shadow(0 0 6px #fff59d); }
  .interior { fill: #24262b; }
  .interior.lit { fill: #3a3b2c; }
  .pad { fill: #777; }
  .pad.on { fill: #ffd54f; animation: blink .5s infinite; }
  .dim { opacity: .2; }
  .blink { animation: blink .5s infinite; }
  .spin { animation: spin 1s linear infinite; transform-origin: center; transform-box: fill-box; }
  .pbtn { fill: #555; stroke: #888; cursor: pointer; }
  .pbtn:hover { stroke: #fff; }
  .pbtn.on { fill: #ffb300; }
  #estop_btn { fill: #7f1d1d; stroke: #a33; cursor: pointer; }
  #estop_btn.on { fill: #ff1744; stroke: #fff; stroke-width: 3; }
  #banner { font-size: 26px; font-weight: bold; }
  @keyframes blink { 50% { opacity: .15; } }
  @keyframes breathe { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <b>MCU 시뮬레이터</b>
  <span class="rx-head">UART 로 받은 명령에 따라 움직이는 시뮬레이터 내부 상태 (마스터 화면은 :8880)</span>
  <span id="simerr" class="err"></span>
</header>
<main>
  <section class="wide">
    <div class="station-bar">
      <h2 style="margin:0">스테이션 (측면에서 본 모습, 오른쪽이 정면)</h2>
      <span class="view-toggle"><button id="view2d" class="on">2D</button><button id="view3d">3D</button></span>
      <span>커버 이동 시간(초) <input type="number" step="0.5" min="0.1" data-key="cover_sec"></span>
      <span>슬라이드 이동 시간(초) <input type="number" step="0.5" min="0.1" data-key="slide_sec"></span>
      <span id="status_line"></span>
    </div>
    <svg id="station2d" viewBox="0 0 900 340">
      <text id="banner" x="450" y="44" text-anchor="middle"></text>
      <text id="env_text" x="885" y="24" text-anchor="end"></text>
      <text id="maint_text" x="885" y="44" text-anchor="end" fill="#ce93d8"></text>
      <text id="hb_text" x="15" y="24"></text>
      <line x1="0" y1="300" x2="900" y2="300" stroke="#555"/>
      <rect id="interior" class="interior" x="158" y="110" width="404" height="180"/>
      <rect id="flood" class="hide" x="158" y="274" width="404" height="16" fill="#1e88e5" opacity=".6"/>
      <rect x="150" y="290" width="420" height="10" fill="#555"/>
      <rect x="150" y="110" width="8" height="180" fill="#666"/>
      <rect x="150" y="102" width="420" height="8" fill="#666"/>
      <rect x="562" y="110" width="8" height="20" fill="#666"/>
      <rect id="led" class="led p0" x="160" y="94" width="400" height="6" rx="3"/>
      <text x="360" y="88" text-anchor="middle" font-size="10">상태 LED</text>
      <line x1="300" y1="240" x2="880" y2="240" stroke="#777" stroke-dasharray="6 4"/>
      <text x="760" y="256" fill="#888">슬라이드 레일 (전개 방향 →)</text>
      <rect id="door_side" class="door" x="170" y="200" width="80" height="86" fill="#7a7f88"/>
      <text x="210" y="196" text-anchor="middle" font-size="10">측면 도어</text>
      <g id="platform">
        <rect id="platform_rect" x="300" y="226" width="160" height="14" rx="3" fill="#9aa4ad"/>
        <rect id="pad1" class="pad" x="366" y="220" width="18" height="6"/>
        <rect id="pad2" class="pad" x="410" y="220" width="18" height="6"/>
        <g id="drone" class="hide">
          <line x1="350" y1="206" x2="450" y2="206" stroke="#aaa" stroke-width="3"/>
          <ellipse cx="350" cy="202" rx="20" ry="4" fill="#999"/>
          <ellipse cx="450" cy="202" rx="20" ry="4" fill="#999"/>
          <rect x="378" y="198" width="44" height="18" rx="5" fill="#cfd8dc"/>
          <rect x="384" y="216" width="6" height="4" fill="#555"/>
          <rect x="410" y="216" width="6" height="4" fill="#555"/>
        </g>
        <text id="bolt" class="hide" x="400" y="262" text-anchor="middle" font-size="18">⚡</text>
        <text id="chg_text" x="400" y="280" text-anchor="middle"></text>
      </g>
      <rect id="door_front" class="door" x="562" y="130" width="8" height="160"/>
      <text x="646" y="316" text-anchor="middle" font-size="10">정면 도어 (아래로 젖혀짐)</text>
      <circle id="lamp_out" class="lamp" cx="586" cy="112" r="7"/>
      <text x="612" y="116" font-size="10">외부등</text>
      <circle id="lamp_in" class="lamp" cx="360" cy="122" r="6"/>
      <text x="360" y="138" text-anchor="middle" font-size="10">내부등</text>
      <text id="buzzer" class="dim" x="172" y="140" font-size="16">🔔</text>
      <circle id="indicator" cx="205" cy="133" r="5" fill="#444"/>
      <text x="190" y="156" text-anchor="middle" font-size="10">알람</text>
      <text id="heater" class="dim" x="480" y="140" font-size="16">🔥</text>
      <text id="cooler" class="dim" x="510" y="140" font-size="16">❄️</text>
      <text id="fan" class="dim" x="540" y="140" font-size="16">🌀</text>
      <text x="515" y="156" text-anchor="middle" font-size="10">공조</text>
      <circle id="estop_btn" cx="60" cy="140" r="16"/>
      <text x="60" y="172" text-anchor="middle" font-size="10">E-STOP (클릭)</text>
      <text x="60" y="200" text-anchor="middle" font-size="10">현장 버튼 (클릭)</text>
      <circle id="btn_door" class="pbtn" cx="45" cy="222" r="9"/>
      <text x="60" y="226" font-size="10">도어</text>
      <circle id="btn_slide" class="pbtn" cx="45" cy="250" r="9"/>
      <text x="60" y="254" font-size="10">슬라이드</text>
      <circle id="btn_maint" class="pbtn" cx="45" cy="278" r="9"/>
      <text x="60" y="282" font-size="10">정비</text>
    </svg>
    <div id="station3d" class="hide"><div id="s3d_banner"></div><div id="s3d_hint">3D 불러오는 중…</div></div>
  </section>
  <section>
    <h2>주입</h2>
    <div id="inject"></div>
    <div id="resp_box">
      응답 조작 —
      예외 <select id="rc_exc"><option value="2">0x02 주소</option><option value="3">0x03 값</option><option value="4">0x04 장치오류</option></select>
      <input id="rc_exc_n" type="number" value="1" min="1" size="3"> 회 <button id="rc_exc_go">보냄</button>
      · CRC 깨기 <input id="rc_crc_n" type="number" value="1" min="1" size="3"> 회 <button id="rc_crc_go">보냄</button>
      · 지연 <input id="rc_delay" type="number" value="0" min="0" step="10" size="4"> ms <button id="rc_delay_go">적용</button>
      <span id="rc_msg" class="rx-head"></span>
    </div>
    <div id="force_box">
      레지스터 강제 (입력 레지스터 표의 값을 눌러 고친다) <button id="force_clear">전체 해제</button>
      <div id="force_list"></div>
    </div>
    <details>
      <summary>MCU 상태 직접 설정 — 내부 상태·보유 레지스터 (force 와 달리 시뮬 동작이 따라감)</summary>

  <section>
    <h2>시뮬레이터 내부</h2>
    <table id="sim_tbl"></table>
  </section>
  <section>
    <h2>입력 레지스터 (마스터가 읽어 가는 값)</h2>
    <table id="reg_tbl"></table>
  </section>
  <section>
    <h2>시뮬레이터 로그 (MCU 시점)</h2>
    <pre id="sim_log"></pre>
  </section>
</main>
<script>
const LED_NAMES = ["OFF", "대기", "모션 중", "개방 대기", "드론 비행 중", "SAFE-HOLD", "FAULT", "정비 모드", "충전 중", "업데이트 중"];
const INJECT_BOOLS = ["estop", "ac_ok", "flood", "drone_detected", "bms_link", "overcurrent", "limit_conflict", "mute"];
const INJECT_PULSES = ["btn_door", "btn_slide", "btn_maint"];
const INJECT_NUMS = ["contact_temp", "temp_in", "hum_in", "motion_timeout_sec"];
const SLIDE_TRAVEL = 330;
const INPUT_SECTIONS = [[0x00, "명령 피드백"], [0x10, "MCU 상태"], [0x20, "커버/슬라이드"], [0x30, "충전기"], [0x40, "환경"], [0x50, "전원"], [0x60, "출력 되읽기"], [0x80, "BMS"], [0xB0, "BMS 식별"]];
let ICD = null;
let simState = null;

async function getJson(url) {
  const r = await fetch(url);
  return r.json();
}

async function postJson(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

function byId(id) {
  return document.getElementById(id);
}

function setText(id, text) {
  byId(id).textContent = text;
}

function setHtml(id, html) {
  byId(id).innerHTML = html;
}

function setClass(id, cls, on) {
  byId(id).classList.toggle(cls, on);
}

function escapeAttr(text) {
  return text.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function regLine(name) {
  let entry = ICD.inputs[name];
  if (entry === undefined) {
    entry = ICD.holding[name];
  }
  if (entry === undefined) {
    return name;
  }
  return `${name} (0x${entry[0].toString(16).toUpperCase().padStart(4, "0")}): ${entry[1]}`;
}

function tip(regs, extra) {
  if (ICD === null || regs === undefined) {
    return "";
  }
  let text = regNames(regs).map(regLine).join("\n");
  if (extra) {
    text += "\n" + extra;
  }
  return text;
}

function regNames(regs) {
  if (regs === undefined) {
    return [];
  }
  if (typeof regs === "string") {
    return [regs];
  }
  return regs;
}

function forceMap() {
  if (simState === null || !simState.force) {
    return {};
  }
  return simState.force;
}

function rowHtml(p) {
  const names = regNames(p[2]).join(",");
  const isForced = regNames(p[2]).some(n => forceMap()[n] !== undefined);
  let cls = "";
  let mark = "";
  if (isForced) {
    cls = " class=\"forced\"";
    mark = ` <span class="force-x" data-regs="${names}" title="강제 해제">✕</span>`;
  }
  return `<tr${cls} title="${escapeAttr(tip(p[2], p[3]))}"><td>${p[0]}</td><td class="val" data-regs="${names}">${p[1]}${mark}</td></tr>`;
}

function rows(id, pairs) {
  setHtml(id, pairs.map(rowHtml).join(""));
}

// 입력 레지스터 전체 (마스터가 읽어 가는 값, 강제값 반영)
function renderRegs(regs) {
  if (ICD === null) {
    return;
  }
  lastRegs = regs;
  const byAddr = Object.keys(regs).sort((a, b) => ICD.inputs[a][0] - ICD.inputs[b][0]);
  let html = "";
  let secAt = -1;
  byAddr.forEach(name => {
    const addr = ICD.inputs[name][0];
    let sec = INPUT_SECTIONS[0];
    INPUT_SECTIONS.forEach(s => {
      if (addr >= s[0]) {
        sec = s;
      }
    });
    if (sec[0] !== secAt) {
      secAt = sec[0];
      html += `<tr><td colspan="2" class="rx-head">${sec[1]}</td></tr>`;
    }
    const hex = "0x" + addr.toString(16).toUpperCase().padStart(4, "0");
    html += rowHtml([`${hex} ${name}`, regs[name], name]);
  });
  setHtml("reg_tbl", html);
}

// 값 칸을 누르면 그 행의 레지스터 값을 강제로 고정합니다
let lastRegs = {};
let isEditing = false;

function openEditor(cell) {
  const names = (cell.dataset.regs || "").split(",").filter(n => n !== "" && lastRegs[n] !== undefined);
  if (names.length === 0) {
    return;
  }
  isEditing = true;
  showEditBadge();
  cell.innerHTML = `<span class="val-edit">`
    + names.map(n => `${n} <input type="number" data-reg="${n}" value="${lastRegs[n]}"> `).join("")
    + `<button class="val-ok">적용</button> <button class="val-no">취소</button></span>`;
  const first = cell.querySelector("input");
  first.focus();
  first.select();
}

function closeEditor() {
  isEditing = false;
  showEditBadge();
}

function showEditBadge() {
  let badge = byId("edit_badge");
  if (badge === null) {
    badge = document.createElement("span");
    badge.id = "edit_badge";
    badge.className = "err";
    document.querySelector("header").appendChild(badge);
  }
  let text = "";
  if (isEditing) {
    text = "편집 중 — 화면 갱신 멈춤 (Esc 로 취소)";
  }
  badge.textContent = text;
}

document.addEventListener("click", e => {
  const isOutside = isEditing && e.target.closest(".val-edit") === null;
  if (isOutside) {
    closeEditor();
  }
  const x = e.target.closest(".force-x");
  if (x) {
    const body = {};
    x.dataset.regs.split(",").forEach(n => { body[n] = null; });
    postJson("/api/force", body);
    return;
  }
  if (e.target.classList.contains("val-ok")) {
    const body = {};
    e.target.closest(".val-edit").querySelectorAll("input").forEach(i => {
      body[i.dataset.reg] = parseInt(i.value);
    });
    postJson("/api/force", body);
    closeEditor();
    return;
  }
  if (e.target.classList.contains("val-no")) {
    closeEditor();
    return;
  }
  const cell = e.target.closest("td.val");
  if (cell && !isEditing) {
    openEditor(cell);
  }
});
document.addEventListener("keydown", e => {
  if (!isEditing) {
    return;
  }
  if (e.key === "Escape") {
    closeEditor();
  }
  if (e.key === "Enter") {
    const ok = document.querySelector(".val-ok");
    if (ok) {
      ok.click();
    }
  }
});

function renderStation(s) {
  const n = s.internal;
  const inj = s.inject;
  const is_cover_motion = n.active !== null && n.active.name.startsWith("COVER");
  const is_slide_motion = n.active !== null && n.active.name.startsWith("SLIDE");
  const angle = n.cover_pos * 90;
  byId("door_front").style.transform = `rotate(${angle}deg)`;
  byId("door_side").style.transform = `scaleY(${Math.max(0.05, Math.cos(angle * Math.PI / 180))})`;
  byId("platform").style.transform = `translateX(${SLIDE_TRAVEL * n.slide_pos}px)`;
  setClass("door_front", "moving", is_cover_motion);
  setClass("door_side", "moving", is_cover_motion);
  setClass("platform_rect", "moving", is_slide_motion);
  setClass("drone", "hide", !inj.drone_detected);
  setClass("pad1", "on", n.chg_on);
  setClass("pad2", "on", n.chg_on);
  setClass("bolt", "hide", !n.chg_on);
  let chgText = "충전 " + n.chg_state;
  if (n.chg_on) {
    chgText += ` ${n.chg_volt.toFixed(2)} V / ${n.chg_amp.toFixed(2)} A`;
  }
  if (n.chg_fault !== "none") {
    chgText += " (" + n.chg_fault + ")";
  }
  setText("chg_text", chgText);
  byId("led").setAttribute("class", "led p" + n.led_pattern);
  setClass("lamp_in", "on", (n.light & 1) !== 0);
  setClass("lamp_out", "on", (n.light & 2) !== 0);
  setClass("interior", "lit", (n.light & 1) !== 0);
  const is_buzzer = (n.alarm & 1) !== 0;
  setClass("buzzer", "dim", !is_buzzer);
  setClass("buzzer", "blink", is_buzzer);
  const is_indicator = (n.alarm & 2) !== 0;
  let indicatorFill = "#444";
  if (is_indicator) {
    indicatorFill = "#ff5252";
  }
  byId("indicator").setAttribute("fill", indicatorFill);
  setClass("indicator", "blink", is_indicator);
  setClass("heater", "dim", (n.climate_out & 1) === 0);
  setClass("cooler", "dim", (n.climate_out & 2) === 0);
  setClass("fan", "dim", (n.climate_out & 4) === 0);
  setClass("fan", "spin", (n.climate_out & 4) !== 0);
  setClass("estop_btn", "on", inj.estop);
  INJECT_PULSES.forEach(k => setClass(k, "on", inj[k]));
  setClass("flood", "hide", !inj.flood);
  setText("env_text", `내부 ${inj.temp_in.toFixed(1)} ℃ / ${inj.hum_in.toFixed(0)} %   접점 ${inj.contact_temp.toFixed(1)} ℃`);
  let maintText = "";
  if (n.maint_active === 1) {
    maintText = `정비 모드 (${n.maint_source})`;
  }
  setText("maint_text", maintText);
  let hbText = "HB age " + n.hb_age + " s";
  if (n.hb_timeout) {
    hbText += "  (타임아웃)";
  }
  setText("hb_text", hbText);
  let banner = "";
  let bannerColor = "#ef6c00";
  if (n.safe_hold) {
    banner = "SAFE-HOLD";
  }
  if (n.fault !== "OK") {
    banner = "FAULT " + n.fault;
    bannerColor = "#d32f2f";
  }
  setText("banner", banner);
  byId("banner").setAttribute("fill", bannerColor);
  let status = `커버 ${n.cover_state} · 슬라이드 ${n.slide_state} · LED ${LED_NAMES[n.led_pattern]}`;
  if (n.active !== null) {
    status += ` · ${n.active.name}`;
    if (n.active.local) {
      status += " (현장 버튼)";
    } else {
      status += ` ${n.progress}%`;
    }
  }
  setText("status_line", status);
  if (window.station3dUpdate) {
    window.station3dUpdate(s);
  }
}

// 2D ↔ 3D 보기 전환 (고른 보기는 브라우저가 기억)
function setView(is_3d) {
  setClass("station2d", "hide", is_3d);
  setClass("station3d", "hide", !is_3d);
  setClass("view2d", "on", !is_3d);
  setClass("view3d", "on", is_3d);

    view = "3d";

byId("view2d").addEventListener("click", () => setView(false));

window.addEventListener("DOMContentLoaded", () => {

  }

function bindInject(root) {
  root.querySelectorAll("input[data-key]").forEach(el => el.addEventListener("change", () => {
    let value = parseFloat(el.value);
    const is_checkbox = el.type === "checkbox";
    if (is_checkbox) {
      value = el.checked;
    }
    postJson("/api/inject", { [el.dataset.key]: value });
  }));
  root.querySelectorAll("button[data-key]").forEach(el => el.addEventListener("click", () => {
    postJson("/api/inject", { [el.dataset.key]: true });
  }));
}

function refreshInject(root, inj) {
  root.querySelectorAll("input[data-key]").forEach(el => {
    const is_editing = el === document.activeElement;
    if (is_editing) {
      return;
    }
    const is_checkbox = el.type === "checkbox";
    if (is_checkbox) {
      el.checked = inj[el.dataset.key];
    } else {
      el.value = inj[el.dataset.key];
    }
  });
}

function renderSim(s) {
  simState = s;
  const inj = s.inject;
  const n = s.internal;
  const box = byId("inject");
  if (box.children.length === 0) {
    const boolHtml = INJECT_BOOLS.map(k => `<label><input type="checkbox" data-key="${k}"> ${k}</label> `).join("");
    const pulseHtml = INJECT_PULSES.map(k => `<button data-key="${k}">${k} 누름</button>`).join("");
    const numHtml = INJECT_NUMS.map(k => `${k} <input type="number" step="0.5" data-key="${k}"> `).join("");
    box.innerHTML = boolHtml + "<br>" + pulseHtml + "<br>" + numHtml;
    bindInject(box);
  }
  refreshInject(document, inj);
  let active = "-";
  if (n.active) {
    active = `#${n.active.seq} ${n.active.name}`;
  }
  rows("sim_tbl", [
    ["sim time", n.time + " s"],
    ["cover / slide", `${n.cover_pos} / ${n.slide_pos}`],
    ["active", active],
    ["safe_hold / fault", `${n.safe_hold} / ${n.fault}`],
    ["hb_timeout / hb_age", `${n.hb_timeout} / ${n.hb_age}s`],
    ["chg_on / bms_pwr", `${n.chg_on} / ${n.bms_pwr}`],
    ["maint", `${n.maint_active} / ${n.maint_source}`],
    ["last_cmd_seq", n.last_cmd_seq],
  ]);
  renderForce(s.force || {});
  renderSet(s);
  renderRegs(s.regs);
  setText("sim_log", s.log.slice().reverse().join("\n"));
  renderStation(s);
}

function renderForce(force) {
  const list = byId("force_list");
  const keys = Object.keys(force);
  if (keys.length === 0) {
    list.innerHTML = "<span class='rx-head'>강제 중인 레지스터 없음 (칩을 누르면 해제)</span>";
  } else {
    list.innerHTML = keys.map(k => `<span class="force-chip" data-key="${k}">${k} = ${force[k]} ✕</span>`).join("");
  }
}

// 직접 설정 표: 행은 처음 한 번만 만들고 현재값 칸만 갱신한다 (입력칸이 200 ms 갱신에 지워지지 않게)
function renderSet(s) {
  const values = Object.assign({}, s.settable, s.holding);
  const tbl = byId("set_tbl");
  if (tbl.rows.length === 0) {
    tbl.innerHTML = Object.keys(values).map(k =>
      `<tr><td>${k}</td><td id="set_cur_${k}"></td><td><input id="set_in_${k}" size="6"> <button data-key="${k}">적용</button></td></tr>`).join("");
  }
  Object.keys(values).forEach(k => {
    let v = values[k];
    if (typeof v === "number") {
      v = Math.round(v * 1e4) / 1e4;   // 소수는 넷째 자리까지 (레이아웃 유지)
    }
    setText("set_cur_" + k, String(v));
  });
}

byId("set_tbl").addEventListener("click", e => {
  const key = e.target.dataset.key;
  if (key === undefined) {
    return;
  }
  const raw = byId("set_in_" + key).value.trim();
  if (raw === "") {
    return;
  }
  postJson("/api/set", { [key]: Number(raw) });
});

byId("force_clear").addEventListener("click", () => postJson("/api/force", {}));
byId("force_list").addEventListener("click", e => {
  const chip = e.target.closest(".force-chip");
  if (chip) {
    postJson("/api/force", { [chip.dataset.key]: null });
  }
});

// 응답 조작 (예외·CRC·지연)
byId("rc_exc_go").addEventListener("click", () => {

byId("rc_delay_go").addEventListener("click", () => {

bindInject(document.querySelector(".station-bar"));
byId("estop_btn").addEventListener("click", () => {

});
INJECT_PULSES.forEach(k => byId(k).addEventListener("click", () => postJson("/api/inject", { [k]: true })));

getJson("/api/icd").then(info => {

});

// 드래그 중에 DOM 을 다시 그리면 텍스트 선택이 풀려서, 그동안은 갱신을 멈춥니다
let mouseDown = false;
document.addEventListener("mousedown", () => { mouseDown = true; });
window.addEventListener("mouseup", () => { mouseDown = false; });
window.addEventListener("blur", () => { mouseDown = false; });

function isSelectingText() {
  if (mouseDown) {
    return true;
  }
  const sel = window.getSelection();
  return sel !== null && sel.rangeCount > 0 && !sel.isCollapsed;
}

setInterval(() => {
  if (isSelectingText() || isEditing) {
    return;
  }
  getJson("/api/state").then(s => {
    renderSim(s);
    setText("simerr", "");
  }).catch(() => setText("simerr", "mcu_sim 연결 실패"));
}, 200);

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

</script>
<script type="module">
// 3D 스테이션. 3D 를 처음 켤 때 three.js·에셋을 CDN 에서 불러온다 (2D 는 인터넷 없이도 동작)
const kW = 1.4;
const kH = 1.0;
const kD = 1.2;
const kWall = 0.04;
const kPlinth = 0.14;
const kSlideTravel = 1.25;
const kSideDoorOpen = Math.PI * 0.56;
const kSideZ0 = -0.3;
const kSideZ1 = 0.16;
const kSideY0 = 0.18;
const kSideY1 = 0.66;
const kLedColors = [0x222222, 0x2e7d32, 0xffb300, 0x1e88e5, 0x00acc1, 0xef6c00, 0xd32f2f, 0x8e24aa, 0x43a047, 0xeeeeee];
const kLedBlinkSec = [0, 0, 0.6, 0, 1.0, 0.5, 0.25, 0, 0, 0.3];
const kLedBreathe = 8;
const kHdri = "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/kloofendal_48d_partly_cloudy_puresky_1k.hdr";
const kTex = "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/";
const kHint = "드래그: 회전 · 휠: 확대 · 우클릭 드래그: 이동 · E-Stop 클릭 가능 · 하늘/바닥: Poly Haven (CC0)";

const box = document.getElementById("station3d");
let THREE = null;
let v = null;
let last = null;
let is_started = false;

window.station3dShow = () => {
  if (is_started) {
    return;
  }
  is_started = true;
  init();
};

window.station3dUpdate = s => {
  last = s;
};

async function init() {
  try {
    THREE = await import("three");
    const mods = await Promise.all([
      import("three/addons/controls/OrbitControls.js"),
      import("three/addons/geometries/RoundedBoxGeometry.js"),
      import("three/addons/loaders/RGBELoader.js"),
      import("three/addons/postprocessing/EffectComposer.js"),
      import("three/addons/postprocessing/RenderPass.js"),
      import("three/addons/postprocessing/UnrealBloomPass.js"),
      import("three/addons/postprocessing/OutputPass.js"),
    ]);
    build(Object.assign({}, ...mods));
    document.getElementById("s3d_hint").textContent = kHint;
  } catch (e) {
    document.getElementById("s3d_hint").textContent = "3D 를 불러오지 못했습니다 (three.js 는 인터넷에서 받습니다): " + e.message;
  }
}

// ---- 만들기 도우미 ----

function mat(color, metalness, roughness, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, metalness, roughness }, extra || {}));
}

function place(mesh, x, y, z, parent) {
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cube(w, h, d, material, x, y, z, parent) {
  return place(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material), x, y, z, parent);
}

function rbox(w, h, d, r, material, x, y, z, parent) {
  return place(new THREE.Mesh(new v.RoundedBoxGeometry(w, h, d, 4, r), material), x, y, z, parent);
}

function cyl(rt, rb, h, material, x, y, z, parent) {
  return place(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), material), x, y, z, parent);
}

function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function pbr(name, repeat) {
  const loader = new THREE.TextureLoader();
  const maps = {};
  for (const [key, suffix] of [["map", "diff"], ["normalMap", "nor_gl"], ["roughnessMap", "rough"]]) {
    const t = loader.load(`${kTex}${name}/${name}_${suffix}_1k.jpg`);
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat, repeat);
    t.anisotropy = 8;
    if (key === "map") {
      t.colorSpace = THREE.SRGBColorSpace;
    }
    maps[key] = t;
  }
  return new THREE.MeshStandardMaterial(maps);
}

// 벽에 붙이는 글자판 (오른쪽 벽 바깥쪽을 봄)
function label(text, color, x, y, z, width, parent) {
  const tex = canvasTexture(512, 128, (g, w, h) => {
    g.fillStyle = color;
    g.font = "bold 96px system-ui, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(text, w / 2, h / 2 + 4);
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(width, width / 4), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  plane.rotation.y = Math.PI / 2;
  plane.position.set(x + 0.013, y, z);
  parent.add(plane);
  return plane;
}

function logoTexture() {
  return canvasTexture(1024, 256, (g, w, h) => {
    g.fillStyle = "#1c2430";
    g.font = "bold 150px system-ui, sans-serif";
    g.fillText("X-SAFE", 20, 150);
    g.fillStyle = "#1e88e5";
    g.fillRect(24, 180, 560, 10);
    g.fillStyle = "#56606c";
    g.font = "600 44px system-ui, sans-serif";
    g.fillText("DS-1  DRONE STATION", 24, 240);
  });
}

function padTexture() {
  return canvasTexture(1024, 1024, (g, w, h) => {
    g.fillStyle = "#2a2e35";
    g.fillRect(0, 0, w, h);
    g.strokeStyle = "#ffc107";
    g.lineWidth = 34;
    g.beginPath();
    g.arc(w / 2, h / 2, 360, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = "#f5f5f5";
    g.font = "bold 460px system-ui, sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText("H", w / 2, h / 2 + 20);
    g.fillStyle = "#ffc107";
    for (const [x, y] of [[40, 40], [w - 140, 40], [40, h - 60], [w - 140, h - 60]]) {
      g.fillRect(x, y, 100, 20);
    }
  });
}

// ---- 장면 ----

function build(m) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  box.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xaebfd0);
  scene.fog = new THREE.Fog(0xaebfd0, 14, 45);
  new m.RGBELoader().load(kHdri, hdr => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = hdr;
    scene.background = hdr;
    scene.backgroundIntensity = 0.85;
  });

  const camera = new THREE.PerspectiveCamera(36, 2, 0.05, 200);
  camera.position.set(2.7, 1.45, 3.1);
  const controls = new m.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.5, 0.65);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 1.2;
  controls.maxDistance = 10;

  const composer = new m.EffectComposer(renderer);
  composer.addPass(new m.RenderPass(scene, camera));
  const bloom = new m.UnrealBloomPass(new THREE.Vector2(512, 512), 0.4, 0.3, 1.1);
  composer.addPass(bloom);
  composer.addPass(new m.OutputPass());

  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x3a3a3a, 0.35));
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2);
  sun.position.set(4, 6, 3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.radius = 4;
  sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, far: 20 });
  scene.add(sun);

  v = { RoundedBoxGeometry: m.RoundedBoxGeometry };

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), pbr("concrete_floor_02", 40));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  const padMatGround = pbr("concrete_tiles", 2);
  rbox(3.0, 0.06, 3.8, 0.02, padMatGround, 0, 0.03, 0.7, scene);

  const white = mat(0xe6eaef, 0.2, 0.42, { envMapIntensity: 0.8 });
  const dark = mat(0x262b33, 0.55, 0.45);
  const inner = mat(0x30343b, 0.2, 0.75);
  const accent = mat(0x1e88e5, 0.35, 0.35);
  const metal = mat(0xa9b3bd, 0.9, 0.28);

  const root = new THREE.Group();
  root.position.y = kPlinth + 0.06;
  scene.add(root);

  // 받침·몸체
  rbox(kW + 0.08, kPlinth, kD + 0.08, 0.02, dark, 0, -kPlinth / 2, 0, root);
  cube(kW, kWall, kD, inner, 0, kWall / 2, 0, root);
  rbox(kW + 0.12, 0.09, kD + 0.12, 0.035, white, 0, kH + 0.045, 0, root);
  rbox(kW, kH, kWall, 0.012, white, 0, kH / 2, -kD / 2 + kWall / 2, root);
  rbox(kWall, kH, kD, 0.012, white, -kW / 2 + kWall / 2, kH / 2, 0, root);
  // 오른쪽 벽은 측면 도어 개구부를 두고 네 조각으로
  const rx = kW / 2 - kWall / 2;
  rbox(kWall, kH, kSideZ0 + kD / 2, 0.01, white, rx, kH / 2, (kSideZ0 - kD / 2) / 2, root);
  rbox(kWall, kH, kD / 2 - kSideZ1, 0.01, white, rx, kH / 2, (kSideZ1 + kD / 2) / 2, root);
  rbox(kWall, kSideY0, kSideZ1 - kSideZ0, 0.01, white, rx, kSideY0 / 2, (kSideZ0 + kSideZ1) / 2, root);
  rbox(kWall, kH - kSideY1, kSideZ1 - kSideZ0, 0.01, white, rx, (kH + kSideY1) / 2, (kSideZ0 + kSideZ1) / 2, root);
  for (const sx of [-1, 1]) {
    cube(0.006, 0.035, kD - 0.06, accent, sx * (kW / 2 + 0.003), kH - 0.16, 0, root);
  }
  cube(kW - 0.06, 0.035, 0.006, accent, 0, kH - 0.16, -kD / 2 - 0.003, root);
  for (const [w, h, d, x, y, z] of [[kW + 0.02, 0.1, 0.05, 0, kH - 0.05, kD / 2], [0.06, kH, 0.05, -kW / 2 + 0.01, kH / 2, kD / 2], [0.06, kH, 0.05, kW / 2 - 0.01, kH / 2, kD / 2]]) {
    rbox(w, h, d, 0.01, dark, x, y, z, root);
  }
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 6; i++) {
      cube(0.008, 0.012, 0.2, dark, sx * (kW / 2 + 0.004), 0.25 + i * 0.03, -kD / 2 + 0.16, root);
    }
  }
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.155), new THREE.MeshStandardMaterial({ map: logoTexture(), transparent: true, roughness: 0.4 }));
  logo.rotation.y = -Math.PI / 2;
  logo.position.set(-kW / 2 - 0.004, 0.62, 0.25);
  root.add(logo);
  const ceilingPanel = cube(kW - 0.16, 0.01, kD - 0.25, mat(0xffffff, 0, 0.5, { emissive: 0xfff3c4, emissiveIntensity: 0 }), 0, kH - 0.012, 0, root);

  // 정면 도어: 아래 모서리를 축으로 앞으로 젖혀짐 (바깥 흰색, 안쪽 어두움)
  const frontPivot = new THREE.Group();
  frontPivot.position.set(0, 0.01, kD / 2 + 0.03);
  root.add(frontPivot);
  const doorH = kH - 0.11;
  rbox(kW - 0.1, doorH, 0.035, 0.012, white, 0, doorH / 2, 0.02, frontPivot);
  cube(kW - 0.16, doorH - 0.06, 0.004, inner, 0, doorH / 2, 0.0, frontPivot);
  cube(kW * 0.62, 0.035, 0.004, accent, 0, doorH * 0.64, 0.04, frontPivot);
  for (const sx of [-1, 1]) {
    const hinge = cyl(0.018, 0.018, 0.12, metal, sx * (kW / 2 - 0.12), 0, 0.02, frontPivot);
    hinge.rotation.z = Math.PI / 2;
  }

  // 측면 도어 (오른쪽 벽): 위로 밀려 올라감
  // 측면 도어 (오른쪽 벽): 뒤쪽 모서리 경첩으로 바깥으로 열림. 커버와 같이 움직인다 (ICD 에 별도 명령 없음)
  const sideDoor = new THREE.Group();
  sideDoor.position.set(kW / 2 + 0.012, kSideY0, kSideZ0);
  root.add(sideDoor);
  const sideW = kSideZ1 - kSideZ0 - 0.01;
  const sideH = kSideY1 - kSideY0 - 0.01;
  rbox(0.022, sideH, sideW, 0.008, white, 0, sideH / 2, sideW / 2, sideDoor);
  cube(0.004, sideH - 0.04, sideW - 0.04, inner, -0.012, sideH / 2, sideW / 2, sideDoor);
  cube(0.004, 0.02, sideW - 0.06, accent, 0.012, sideH * 0.8, sideW / 2, sideDoor);
  rbox(0.02, 0.12, 0.022, 0.008, dark, 0.02, sideH / 2, sideW - 0.05, sideDoor);
  for (const y of [0.06, sideH - 0.06]) {
    cyl(0.012, 0.012, 0.07, metal, 0, y, 0, sideDoor);
  }

  // 착륙판 (슬라이드) + 헬리패드 + 충전 패드
  const platform = new THREE.Group();
  root.add(platform);
  rbox(kW - 0.22, 0.05, kD - 0.14, 0.01, metal, 0, 0.3, 0, platform);
  const deck = new THREE.Mesh(new THREE.PlaneGeometry(kW - 0.3, kD - 0.22), new THREE.MeshStandardMaterial({ map: padTexture(), roughness: 0.7 }));
  deck.rotation.x = -Math.PI / 2;
  deck.position.y = 0.326;
  deck.receiveShadow = true;
  platform.add(deck);
  const padMat = mat(0x8d8d8d, 0.8, 0.3, { emissive: 0xffc94d, emissiveIntensity: 0 });
  cube(0.07, 0.008, 0.16, padMat, -0.15, 0.331, 0.02, platform);
  cube(0.07, 0.008, 0.16, padMat, 0.15, 0.331, 0.02, platform);
  for (const x of [-0.46, 0.46]) {
    cube(0.03, 0.03, kD - 0.1, metal, x, 0.26, 0, root);
  }

  // 드론 (하중 센서가 감지하면 보임)
  const drone = new THREE.Group();
  drone.position.set(0, 0.4, 0.02);
  platform.add(drone);
  const shell = mat(0xd9dde2, 0.3, 0.35);
  const carbon = mat(0x1d1f23, 0.4, 0.5);
  rbox(0.2, 0.07, 0.3, 0.025, shell, 0, 0.02, 0, drone);
  rbox(0.14, 0.03, 0.22, 0.012, carbon, 0, 0.065, -0.01, drone);
  const cam = new THREE.Mesh(new THREE.SphereGeometry(0.03, 24, 16), carbon);
  place(cam, 0, -0.03, 0.14, drone);
  const lens = cyl(0.012, 0.012, 0.01, mat(0x0a2a4a, 0.9, 0.1), 0, -0.03, 0.17, drone);
  lens.rotation.x = Math.PI / 2;
  const props = [];
  const navMats = [];
  for (const [i, a] of [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4].entries()) {
    const ax = Math.cos(a);
    const az = Math.sin(a);
    const arm = cyl(0.011, 0.014, 0.26, carbon, ax * 0.17, 0.03, az * 0.17, drone);
    arm.rotation.z = Math.PI / 2;
    arm.rotation.y = -a;
    cyl(0.024, 0.024, 0.035, carbon, ax * 0.3, 0.045, az * 0.3, drone);
    const prop = new THREE.Group();
    prop.position.set(ax * 0.3, 0.068, az * 0.3);
    drone.add(prop);
    cube(0.24, 0.003, 0.022, carbon, 0, 0, 0, prop);
    props.push(prop);
    const is_front = az > 0;
    let navColor = 0x00e676;
    if (is_front) {
      navColor = 0xff1744;
    }
    const nav = mat(0x111111, 0, 0.3, { emissive: navColor, emissiveIntensity: 2 });
    navMats.push(nav);
    place(new THREE.Mesh(new THREE.SphereGeometry(0.008, 12, 8), nav), ax * 0.3, 0.02, az * 0.3, drone);
    if (i < 2) {
      const skid = cyl(0.006, 0.006, 0.26, carbon, (i * 2 - 1) * 0.09, -0.055, 0, drone);
      skid.rotation.x = Math.PI / 2;
    }
  }
  for (const [x, z] of [[-0.09, -0.08], [0.09, -0.08], [-0.09, 0.08], [0.09, 0.08]]) {
    cyl(0.005, 0.005, 0.06, carbon, x, -0.025, z, drone);
  }

  // 상태 LED 띠 (정면 위 프레임)
  const ledMat = mat(0x111111, 0, 0.3, { emissive: 0x222222, emissiveIntensity: 1 });
  cube(kW - 0.16, 0.018, 0.01, ledMat, 0, kH - 0.05, kD / 2 + 0.03, root);

  // 지붕 장비: 경광등·투광등·GNSS·안테나·풍속계·감시 카메라
  const roofY = kH + 0.09;
  cyl(0.06, 0.07, 0.035, dark, -kW / 2 + 0.16, roofY + 0.018, -kD / 2 + 0.2, root);
  const beaconMat = mat(0x3a0000, 0, 0.15, { emissive: 0xff1744, emissiveIntensity: 0, transparent: true, opacity: 0.85 });
  place(new THREE.Mesh(new THREE.SphereGeometry(0.055, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), beaconMat), -kW / 2 + 0.16, roofY + 0.035, -kD / 2 + 0.2, root);
  const beaconLight = new THREE.PointLight(0xff1744, 0, 3.5);
  beaconLight.position.set(-kW / 2 + 0.16, roofY + 0.12, -kD / 2 + 0.2);
  root.add(beaconLight);
  const lampMat = mat(0x222222, 0.3, 0.2, { emissive: 0xfff4d6, emissiveIntensity: 0 });
  rbox(0.34, 0.04, 0.07, 0.01, dark, 0.2, roofY + 0.02, kD / 2 - 0.02, root);
  cube(0.3, 0.02, 0.005, lampMat, 0.2, roofY + 0.02, kD / 2 + 0.016, root);
  const outerLight = new THREE.SpotLight(0xfff4d6, 0, 7, Math.PI / 4.5, 0.6, 1.2);
  outerLight.position.set(0.2, roofY + 0.02, kD / 2 + 0.03);
  outerLight.target.position.set(0, 0, kD / 2 + 1.4);
  root.add(outerLight, outerLight.target);
  const innerLight = new THREE.PointLight(0xfff3c4, 0, 2.5);
  innerLight.position.set(0, kH - 0.15, 0);
  root.add(innerLight);
  cyl(0.05, 0.05, 0.022, white, kW / 2 - 0.2, roofY + 0.011, -kD / 2 + 0.2, root);
  for (const x of [kW / 2 - 0.34, kW / 2 - 0.06]) {
    cyl(0.006, 0.009, 0.32, dark, x, roofY + 0.16, -kD / 2 + 0.12, root);
  }
  cyl(0.008, 0.008, 0.3, metal, 0, roofY + 0.15, -kD / 2 + 0.15, root);
  const anemo = new THREE.Group();
  anemo.position.set(0, roofY + 0.31, -kD / 2 + 0.15);
  root.add(anemo);
  for (let i = 0; i < 3; i++) {
    const arm = new THREE.Group();
    arm.rotation.y = i * 2 * Math.PI / 3;
    anemo.add(arm);
    cube(0.12, 0.005, 0.005, metal, 0.06, 0, 0, arm);
    place(new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 8, 0, Math.PI), dark), 0.12, 0, 0, arm);
  }
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat(0x0d0f12, 0.6, 0.08, { transparent: true, opacity: 0.92 }));
  place(dome, -kW / 2 + 0.08, kH - 0.005, kD / 2 - 0.08, root);

  // 공조: 왼쪽 벽 환풍기 + 히터·쿨러 표시등
  const fan = new THREE.Group();
  fan.position.set(-kW / 2 - 0.014, 0.62, -0.2);
  root.add(fan);
  const grille = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.012, 12, 40), dark);
  grille.rotation.y = Math.PI / 2;
  fan.add(grille);
  const blades = new THREE.Group();
  fan.add(blades);
  for (let i = 0; i < 5; i++) {
    const blade = cube(0.005, 0.1, 0.035, metal, 0, 0, 0, blades);
    blade.geometry.translate(0, 0.05, 0);
    blade.rotation.x = i * 2 * Math.PI / 5;
  }
  const heaterMat = mat(0x220800, 0, 0.3, { emissive: 0xff5722, emissiveIntensity: 0 });
  const coolerMat = mat(0x000a22, 0, 0.3, { emissive: 0x29b6f6, emissiveIntensity: 0 });
  place(new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), heaterMat), -kW / 2 - 0.01, 0.8, -0.3, root);
  place(new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), coolerMat), -kW / 2 - 0.01, 0.8, -0.1, root);

  // 조작 패널 (오른쪽 벽 앞쪽): E-STOP + 현장 버튼 3개, 클릭하면 실제 주입
  const panelX = kW / 2 + 0.012;
  const panelZ = kD / 2 - 0.21;
  rbox(0.02, 0.62, 0.34, 0.012, dark, panelX, 0.66, panelZ, root);
  rbox(0.022, 0.2, 0.2, 0.01, mat(0xffc107, 0.2, 0.45), panelX + 0.004, 0.83, panelZ, root);
  const estopMat = mat(0xb71c1c, 0.1, 0.3, { emissive: 0xff1744, emissiveIntensity: 0 });
  const estop = cyl(0.07, 0.06, 0.06, estopMat, panelX + 0.045, 0.83, panelZ, root);
  estop.rotation.z = Math.PI / 2;
  label("E-STOP", "#ffc107", panelX, 0.955, panelZ, 0.22, root);
  const buttons = [{ mesh: estop, key: "estop", mat: estopMat }];
  for (const [i, [key, text, color]] of [["btn_door", "도어", 0x2e7d32], ["btn_slide", "슬라이드", 0x1565c0], ["btn_maint", "정비", 0x7b1fa2]].entries()) {
    const y = 0.64 - i * 0.095;
    const z = panelZ - 0.09;
    const btnMat = mat(color, 0.2, 0.35, { emissive: color, emissiveIntensity: 0 });
    const btn = cyl(0.036, 0.036, 0.03, btnMat, panelX + 0.024, y, z, root);
    btn.rotation.z = Math.PI / 2;
    cyl(0.043, 0.043, 0.012, metal, panelX + 0.012, y, z, root).rotation.z = Math.PI / 2;
    label(text, "#ffffff", panelX, y, panelZ + 0.06, 0.2, root);
    buttons.push({ mesh: btn, key, mat: btnMat });
  }

  // 침수: 바닥의 물
  const water = cube(kW - 0.1, 0.06, kD - 0.1, mat(0x1e88e5, 0.1, 0.05, { transparent: true, opacity: 0.5 }), 0, kWall + 0.03, 0, root);
  water.castShadow = false;

  Object.assign(v, { renderer, scene, camera, controls, composer, bloom, frontPivot, sideDoor, platform, drone, props, navMats, padMat, ledMat,
    beaconMat, beaconLight, lampMat, outerLight, innerLight, ceilingPanel, blades, anemo, heaterMat, coolerMat, estop, estopMat, buttons, water,
    cover: 0, slide: 0, clock: new THREE.Clock() });

  new ResizeObserver(resize).observe(box);
  resize();
  bindClick();
  renderer.setAnimationLoop(frame);
}

function resize() {
  const w = box.clientWidth;
  const h = box.clientHeight;
  if (w === 0 || h === 0) {
    return;
  }
  v.renderer.setSize(w, h);
  v.composer.setSize(w, h);
  v.camera.aspect = w / h;
  v.camera.updateProjectionMatrix();
}

// 마우스 아래의 패널 버튼 (없으면 null)
function buttonAt(e) {
  const r = v.renderer.domElement.getBoundingClientRect();
  const p = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(p, v.camera);
  const hit = ray.intersectObjects(v.buttons.map(b => b.mesh))[0];
  if (hit === undefined) {
    return null;
  }
  return v.buttons.find(b => b.mesh === hit.object);
}

// 버튼 클릭 → 주입. E-STOP 은 눌림/해제 전환, 현장 버튼은 한 번 누름 (드래그로 돌린 건 클릭으로 치지 않음)
function bindClick() {
  const el = v.renderer.domElement;
  let downAt = null;
  el.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  el.addEventListener("pointerup", e => {
    const is_click = downAt !== null && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 4;
    downAt = null;
    const b = buttonAt(e);
    if (!is_click || last === null || b === null) {
      return;
    }
    let value = true;
    if (b.key === "estop") {
      value = !last.inject.estop;
    }
    window.postJson("/api/inject", { [b.key]: value });
  });
  el.addEventListener("pointermove", e => {
    let cursor = "grab";
    if (buttonAt(e) !== null) {
      cursor = "pointer";
    }
    el.style.cursor = cursor;
  });
}

function ledLevel(pattern, t) {
  if (pattern === kLedBreathe) {
    return 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * Math.PI));
  }
  const sec = kLedBlinkSec[pattern];
  if (sec === 0) {
    return 1;
  }
  if ((t % sec) < sec / 2) {
    return 1;
  }
  return 0.12;
}

function frame() {
  const dt = Math.min(v.clock.getDelta(), 0.1);
  const t = v.clock.elapsedTime;
  v.controls.update();
  v.anemo.rotation.y += dt * 3;
  if (last !== null) {
    apply(last, dt, t);
  }
  v.composer.render();
}

// 스냅샷 → 장면. 위치는 부드럽게 따라가고 빛은 패턴대로 깜빡인다
function apply(s, dt, t) {
  const n = s.internal;
  const inj = s.inject;
  const k = Math.min(1, dt * 10);
  v.cover += (n.cover_pos - v.cover) * k;
  v.slide += (n.slide_pos - v.slide) * k;
  v.frontPivot.rotation.x = v.cover * Math.PI / 2;
  v.sideDoor.rotation.y = v.cover * kSideDoorOpen;
  v.platform.position.z = v.slide * kSlideTravel;
  v.drone.visible = inj.drone_detected;
  const is_nav_on = (t % 1.2) < 0.15;
  for (const nav of v.navMats) {
    nav.emissiveIntensity = 0.3;
    if (is_nav_on) {
      nav.emissiveIntensity = 4;
    }
  }

  let pad = 0;
  if (n.chg_on) {
    pad = 0.8 + 0.8 * (0.5 + 0.5 * Math.sin(t * 5));
  }
  v.padMat.emissiveIntensity = pad;

  const pattern = n.led_pattern;
  v.ledMat.emissive.setHex(kLedColors[pattern] || kLedColors[0]);
  v.ledMat.emissiveIntensity = 3 * ledLevel(pattern, t);

  const is_inner = (n.light & 1) !== 0;
  const is_outer = (n.light & 2) !== 0;
  v.innerLight.intensity = 0;
  v.ceilingPanel.material.emissiveIntensity = 0;
  if (is_inner) {
    v.innerLight.intensity = 1.5;
    v.ceilingPanel.material.emissiveIntensity = 0.9;
  }
  v.outerLight.intensity = 0;
  v.lampMat.emissiveIntensity = 0;
  if (is_outer) {
    v.outerLight.intensity = 30;
    v.lampMat.emissiveIntensity = 4;
  }

  const is_indicator = (n.alarm & 2) !== 0;
  let beacon = 0;
  if (is_indicator) {
    beacon = Math.max(0, Math.sin(t * 12));
  }
  v.beaconMat.emissiveIntensity = beacon * 4;
  v.beaconLight.intensity = beacon * 5;

  if ((n.climate_out & 4) !== 0) {
    v.blades.rotation.x += dt * 16;
  }
  v.heaterMat.emissiveIntensity = 0;
  if ((n.climate_out & 1) !== 0) {
    v.heaterMat.emissiveIntensity = 3;
  }
  v.coolerMat.emissiveIntensity = 0;
  if ((n.climate_out & 2) !== 0) {
    v.coolerMat.emissiveIntensity = 3;
  }

  v.estop.position.x = kW / 2 + 0.057;
  v.estopMat.emissiveIntensity = 0;
  if (inj.estop) {
    v.estop.position.x = kW / 2 + 0.04;
    v.estopMat.emissiveIntensity = 1 + 0.8 * Math.sin(t * 8);
  }
  for (const b of v.buttons.slice(1)) {
    b.mat.emissiveIntensity = 0;
    if (inj[b.key]) {
      b.mat.emissiveIntensity = 3;
    }
  }
  v.water.visible = inj.flood;

  let banner = "";
  let color = "#ef6c00";
  if (n.safe_hold) {
    banner = "SAFE-HOLD";
  }
  if (n.fault !== "OK") {
    banner = "FAULT " + n.fault;
    color = "#ff5252";
  }
  const el = document.getElementById("s3d_banner");
  el.textContent = banner;
  el.style.color = color;
}
</script>
</body>
</html>
